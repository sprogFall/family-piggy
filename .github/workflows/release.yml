name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-build
  cancel-in-progress: false

env:
  # 客户端连接信息：Metro 打包时把 EXPO_PUBLIC_* 内联进 bundle，值取自仓库 Secrets
  EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  # CI 非交互环境，关闭 Expo CLI 遥测
  EXPO_NO_TELEMETRY: '1'

jobs:
  build-apk:
    # 固定镜像：ubuntu-latest 自 2026-10-19 起迁移到 Ubuntu 26，固定可避免构建环境被动突变
    runs-on: ubuntu-24.04
    # 发布 Release 需要写权限（默认 GITHUB_TOKEN 在部分仓库设置下是只读的）
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # 缓存 Gradle 用户目录与依赖，二次构建可显著提速
      # 固定在 v5：v6 起默认改用专有的 enhanced 缓存实现，v5 与 v4 的缓存 key 格式一致，
      # 升级不会让已预热的缓存失效，也无需引入额外依赖
      - uses: gradle/actions/setup-gradle@v5

      - name: 安装依赖
        run: npm ci

      # 打印 commit 与实际安装的原生模块版本：失败时可据此判断是否跑在预期的代码/依赖上
      - name: 输出构建环境信息
        run: node -e "const read=(n)=>{try{return require(n+'/package.json').version}catch{return '缺失'}};console.log('commit', process.env.GITHUB_SHA);console.log('node', process.version, '| expo', read('expo'), '| expo-font', read('expo-font'), '| expo-modules-core', read('expo-modules-core'), '| react-native', read('react-native'))"

      # 原生模块版本必须与 Expo SDK 对齐，否则 gradle 阶段会报难以定位的插件错误
      - name: 校验依赖与 Expo SDK 匹配
        run: npx expo install --check

      # 这里刻意不再重复跑 typecheck + jest：发布用的 tag 指向 main 上的提交，
      # push 到 main 时 ci.yml 已对同一 SHA 执行过同样的质量门禁。
      # 注意：Metro / Gradle 打包不会做类型检查，所以请勿从未经 CI 的提交直接打标签。
      - name: 校验 Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          for name in SUPABASE_URL SUPABASE_ANON_KEY ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::缺少仓库 Secret：$name（Settings → Secrets and variables → Actions）"
              exit 1
            fi
          done

      - name: 解析版本号与发布标签
        run: |
          echo "ANDROID_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            # 手动触发没有 tag：用运行序号生成预发布标签，
            # 保证每次构建都能在 Releases 页面拿到可直接下载的 APK
            echo "RELEASE_TAG=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: 还原签名 keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: 生成 Android 工程（expo prebuild）
        run: npx expo prebuild --platform android --no-install

      # 应用统一的 Gradle 调优：并行、build cache、关闭 release lint。
      # 该脚本同时供 warm-android-cache.yml 使用，保证预热缓存与发布构建同 key。
      - name: 调优 Gradle 构建参数
        run: bash .github/scripts/configure-android-gradle.sh

      # Gradle 官方建议 CI 使用 -bin 分发包（仅运行时，不含源码 / 文档）；
      # Expo 模板默认是 -all.zip，体积约多 100MB，每次冷启动都要重新下载
      - name: 切换 Gradle 分发包为 -bin
        run: |
          sed -i 's#gradle-\([0-9.]*\)-all\.zip#gradle-\1-bin.zip#' android/gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: 打包 APK（gradle assembleRelease + keystore 签名）
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            --build-cache \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"

      - name: 校验 APK 签名
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "--------- 签名信息 ---------"
          "$APKSIGNER" verify --print-certs "$APK"
          if "$APKSIGNER" verify --print-certs "$APK" | grep -q "CN=Android Debug"; then
            echo "::error::APK 仍是 debug 签名，keystore 注入未生效"
            exit 1
          fi

      - name: 整理产物
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          NAME="family-piggy-${RELEASE_TAG}.apk"
          cp "$APK" "$NAME"
          ls -lh "$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          # 应用内更新会带下载地址、大小与 SHA256 做完整性校验，这里一并算好写进 Release 说明
          echo "APK_SHA256=$(sha256sum "$NAME" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "APK_SIZE=$(stat -c%s "$NAME")" >> "$GITHUB_ENV"

      # Actions Artifacts 一定会被打包成 zip，下载后还要解压；
      # 这里改为发布 Release 资产，.apk 可直接点击下载安装。
      - name: 发布 Release（APK 作为可直接下载的安装包）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="$APK_NAME"
          TITLE="家庭记账 ${RELEASE_TAG}"
          # 末行 SHA256 为机器可读行，App 端解析后用于安装包完整性校验，请勿删改格式
          NOTES=$(printf '%s\n' \
            "Android 安装包（已用仓库 keystore 签名，可直接覆盖安装升级）。" \
            "" \
            "- 版本：${RELEASE_TAG}" \
            "- 提交：${GITHUB_SHA}" \
            "- 构建号：${GITHUB_RUN_NUMBER}" \
            "- 安装包：${APK}（${APK_SIZE} 字节）" \
            "" \
            "在下方 Assets 中直接下载 .apk 安装，无需解压。" \
            "" \
            "SHA256: ${APK_SHA256}")

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # 同一标签重跑时覆盖资产与说明，保持幂等
            gh release upload "$RELEASE_TAG" "$APK" --clobber
            gh release edit "$RELEASE_TAG" --notes "$NOTES"
          else
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              EXTRA=""
            else
              EXTRA="--prerelease --target=$GITHUB_SHA"
            fi
            gh release create "$RELEASE_TAG" "$APK" --title "$TITLE" --notes "$NOTES" $EXTRA
          fi

          URL=$(gh release view "$RELEASE_TAG" --json url -q .url)
          echo "APK 下载地址：$URL" >> "$GITHUB_STEP_SUMMARY"
